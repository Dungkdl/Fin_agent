[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsight-agent"
version = "0.1.0"
description = "FinSight Agent Crypto Quant Expert"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tenacity>=8.2.0",
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
finsight = "finsight.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration", "tests/end_to_end"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]


